[project]
name = "crop-storage-prototype"
version = "0.1.0"
description = "Simulation-only grouped evaluation for stored-crop quality and survival models"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "xgboost>=2.0,<4",
  "lightgbm>=4.0,<5",
  "joblib>=1.3",
  "openpyxl>=3.1",
]

[project.scripts]
crop-prototype = "crop_prototype.cli:main"

[tool.setuptools.packages.find]
include = ["crop_prototype*"]
